<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>メンテナンス設定</title>

<style>

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;

    background:#f5f5f5;

    margin:0;
    padding:30px 20px;

    color:#222;
}

.container{
    max-width:700px;
    margin:0 auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.card{
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

</style>

</head>


<body>

<div class="container">

    <h1>メンテナンス設定</h1>

<div class="card">

    <h2>メンテナンス</h2>

    <label>
        <input type="checkbox" id="maintenanceEnabled">
        メンテナンスを有効にする
    </label>

    <hr>

    <h2>メンテナンス日時</h2>

    <label>
        開始日時
        <input
            type="datetime-local"
            id="startAt"
        >
    </label>

    <br><br>

    <label>
        終了日時
        <input
            type="datetime-local"
            id="endAt"
        >
    </label>

    <br><br>

    <button id="saveBtn">
        設定を保存
    </button>

    <p id="message"></p>

</div>

</div>


<script>

const SUPABASE_URL =
"https://atntpiskoizpysukygcb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_y1wlMl-CRMTt-6us0M-P4Q_8OPouULn";

const token =
localStorage.getItem("admin_access_token");


if(!token){

    location.href =
    "admin.html";

}

const maintenanceEnabled =
    document.getElementById("maintenanceEnabled");

const startAt =
    document.getElementById("startAt");

const endAt =
    document.getElementById("endAt");

const saveBtn =
    document.getElementById("saveBtn");

const message =
    document.getElementById("message");


async function loadMaintenanceSettings(){

    try{

        const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/maintenance_settings?id=eq.1`,
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );

if(!response.ok){

    const errorText =
        await response.text();

    throw new Error(
        "HTTP " +
        response.status +
        ": " +
        errorText
    );
}

        const data =
        await response.json();

        if(data.length === 0){
            return;
        }

        const settings = data[0];

        maintenanceEnabled.checked =
            settings.maintenance_enabled;

        if(settings.start_at){

            startAt.value =
                new Date(settings.start_at)
                .toLocaleString(
                    "sv-SE",
                    {
                        timeZone:"Asia/Tokyo"
                    }
                )
                .replace(" ","T");
        }

        if(settings.end_at){

            endAt.value =
                new Date(settings.end_at)
                .toLocaleString(
                    "sv-SE",
                    {
                        timeZone:"Asia/Tokyo"
                    }
                )
                .replace(" ","T");
        }

    }catch(error){

        message.textContent =
            "設定の読み込みに失敗しました。";

        console.error(error);

    }

}


loadMaintenanceSettings();

saveBtn.addEventListener(
    "click",
    async function(){

    alert("日時チェックに入る前");

        message.textContent =
            "保存中...";

            // メンテナンスがONの場合は日時を必須にする
if(maintenanceEnabled.checked){

    if(!startAt.value || !endAt.value){

        message.textContent =
            "開始日時と終了日時を入力してください。";

        return;

    }

    const startDate = new Date(startAt.value);
    const endDate = new Date(endAt.value);

    if(endDate <= startDate){

        message.textContent =
            "終了日時は開始日時より後に設定してください。";

        return;

    }

}

        const startValue =
            startAt.value
            ? new Date(startAt.value).toISOString()
            : null;

        const endValue =
            endAt.value
            ? new Date(endAt.value).toISOString()
            : null;

        try{

            const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/maintenance_settings?id=eq.1`,
                {
                    method:"PATCH",

                    headers:{
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${token}`,

                        "Prefer":
                            "return=minimal"
                    },

                    body:JSON.stringify({

                        maintenance_enabled:
                            maintenanceEnabled.checked,

                        start_at:
                            startValue,

                        end_at:
                            endValue,

                        updated_at:
                            new Date().toISOString()

                    })
                }
            );

            if(!response.ok){

                const errorText =
                    await response.text();

                throw new Error(
                    errorText ||
                    "保存に失敗しました"
                );
            }

            message.textContent =
                "設定を保存しました。";

        }catch(error){

            message.textContent =
                "保存に失敗しました。";

            console.error(
                "メンテナンス設定保存エラー:",
                error
            );

        }

    }
);

</script>

</body>

</html>
