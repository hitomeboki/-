<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>モード別分析 | ひとめぼき道場</title>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>

        body{
            font-family:Arial,sans-serif;
            background:#f7f7f7;
            margin:0;
            padding:30px;
        }

        h1{
            text-align:center;
            margin-bottom:30px;
        }

        .modes-card{
            max-width:1000px;
            margin:30px auto;
            padding:30px;
            background:white;
            border-radius:16px;
            box-shadow:0 3px 12px rgba(0,0,0,0.08);
        }

        .modes-card h2{
            margin-top:0;
            margin-bottom:20px;
        }

        .period-section{
            max-width:1000px;
            margin:30px auto;
            padding:25px;
            background:white;
            border-radius:16px;
            box-shadow:0 3px 12px rgba(0,0,0,0.08);
        }

        .period-inputs{
            display:flex;
            align-items:center;
            justify-content:center;
            gap:15px;
        }

        .period-inputs input{
            width:220px;
            height:48px;
            padding:0 12px;
            font-size:16px;
            box-sizing:border-box;
            border:1px solid #ccc;
            border-radius:10px;
        }

        .period-inputs span{
            font-size:20px;
            font-weight:bold;
        }

        .chart-grid{
            display:grid;
            grid-template-columns:1fr 1fr;
            gap:30px;
        }

        .chart-box{
            min-width:0;
        }

        .chart-box h3{
            text-align:center;
            margin-bottom:20px;
        }

        .chart-box canvas{
            max-height:350px;
        }

        .mode-table{
            width:100%;
            border-collapse:collapse;
            margin-top:20px;
        }

        .mode-table th,
        .mode-table td{
            padding:14px 10px;
            text-align:center;
            border-bottom:1px solid #eee;
        }

        .mode-table th{
            background:#f5f5f5;
        }

        .back-btn{
            display:block;
            width:300px;
            margin:40px auto 20px;
            padding:16px;
            background:#222;
            color:white;
            text-align:center;
            text-decoration:none;
            font-size:17px;
            font-weight:bold;
            border-radius:12px;
        }

        .back-btn:active{
            transform:scale(0.98);
        }

        @media(max-width:700px){

            body{
                padding:15px;
            }

            .chart-grid{
                grid-template-columns:1fr;
            }

            .period-inputs{
                flex-direction:column;
            }

            .period-inputs input{
                width:100%;
            }

            .mode-table{
                font-size:14px;
            }

        }

    </style>

</head>

<body>

<h1>🎯 モード別分析</h1>


<section class="period-section">

    <h2>📆 期間指定</h2>

    <div class="period-inputs">

        <input
            type="date"
            id="modeStart">

        <span>〜</span>

        <input
            type="date"
            id="modeEnd">

    </div>

</section>


<section class="modes-card">

    <h2>📊 モード別利用割合</h2>

    <div class="chart-grid">

        <div class="chart-box">

            <h3>利用回数</h3>

            <canvas id="usageChart"></canvas>

        </div>


        <div class="chart-box">

            <h3>問題数</h3>

            <canvas id="questionChart"></canvas>

        </div>

    </div>

</section>


<section class="modes-card">

    <h2>📋 モード別詳細</h2>

    <table class="mode-table">

        <thead>

            <tr>

                <th>モード</th>

                <th>利用回数</th>

                <th>問題数</th>

                <th>正解率</th>

            </tr>

        </thead>

        <tbody id="modeTableBody">

            <tr>

                <td colspan="4">
                    読み込み中...
                </td>

            </tr>

        </tbody>

    </table>

</section>


<a
    href="admin-dashboard.html"
    class="back-btn"
>
    ← 管理メニューに戻る
</a>


<script>

const SUPABASE_URL =
    "https://atntpiskoizpysukygcb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_y1wlMl-CRMTt-6us0M-P4Q_8OPouULn";


// =========================
// 日付を設定
// =========================

const today = new Date();

const thirtyDaysAgo = new Date();
thirtyDaysAgo.setDate(
    today.getDate() - 29
);

function formatDate(date){

    const year =
        date.getFullYear();

    const month =
        String(date.getMonth() + 1)
            .padStart(2, "0");

    const day =
        String(date.getDate())
            .padStart(2, "0");

    return `${year}-${month}-${day}`;

}


document.getElementById("modeStart").value =
    formatDate(thirtyDaysAgo);

document.getElementById("modeEnd").value =
    formatDate(today);


// =========================
// グラフ
// =========================

let usageChart = null;
let questionChart = null;


// =========================
// データ取得
// =========================

async function loadModeData(){

    const startDate =
        document.getElementById("modeStart").value;

    const endDate =
        document.getElementById("modeEnd").value;


    if(!startDate || !endDate){

        return;

    }


    if(startDate > endDate){

        alert("開始日は終了日以前にしてください");

        return;

    }


    const token =
        localStorage.getItem(
            "admin_access_token"
        );


    if(!token){

        alert("ログイン情報がありません");

        location.href = "admin.html";

        return;

    }


    const url =
        `${SUPABASE_URL}/rest/v1/rpc/get_mode_stats`;


    const response =
        await fetch(url, {

            method:"POST",

            headers:{

                "Content-Type":
                    "application/json",

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    `Bearer ${token}`

            },

            body:JSON.stringify({

                start_date:
                    startDate,

                end_date:
                    endDate

            })

        });


    const data =
        await response.json();


    if(!response.ok){

        alert(
            "モード別データの取得に失敗しました。\n" +
            "HTTPステータス：" +
            response.status +
            "\n" +
            JSON.stringify(data)
        );

        return;

    }


    updateTable(data);

    updateCharts(data);

}


// =========================
// 表
// =========================

function updateTable(data){

    const tbody =
        document.getElementById(
            "modeTableBody"
        );


    const modes = [

        "一問一答",
        "分類",
        "苦手克服"

    ];


    let html = "";


    for(const mode of modes){

        const item =
            data.find(
                row => row.mode === mode
            );


        if(item){

            html += `

            <tr>

                <td>${mode}</td>

                <td>
                    ${Number(item.usage_count).toLocaleString()}
                </td>

                <td>
                    ${Number(item.questions).toLocaleString()}
                </td>

                <td>
                    ${Number(item.accuracy).toFixed(1)}%
                </td>

            </tr>

            `;

        }else{

            html += `

            <tr>

                <td>${mode}</td>

                <td>0</td>

                <td>0</td>

                <td>0.0%</td>

            </tr>

            `;

        }

    }


    tbody.innerHTML = html;

}


// =========================
// グラフ
// =========================

function updateCharts(data){

    const modes = [

        "一問一答",
        "分類",
        "苦手克服"

    ];


    const usageData =
        modes.map(mode => {

            const item =
                data.find(
                    row => row.mode === mode
                );

            return item
                ? Number(item.usage_count)
                : 0;

        });


    const questionData =
        modes.map(mode => {

            const item =
                data.find(
                    row => row.mode === mode
                );

            return item
                ? Number(item.questions)
                : 0;

        });


    if(usageChart){

        usageChart.destroy();

    }


    if(questionChart){

        questionChart.destroy();

    }


    const usageCanvas =
        document.getElementById(
            "usageChart"
        );


    const questionCanvas =
        document.getElementById(
            "questionChart"
        );


    usageChart =
        new Chart(
            usageCanvas,
            {

                type:"pie",

                data:{

                    labels:modes,

                    datasets:[{

                        data:usageData

                    }]

                },

                options:{

                    responsive:true,

                    maintainAspectRatio:false

                }

            }

        );


    questionChart =
        new Chart(
            questionCanvas,
            {

                type:"pie",

                data:{

                    labels:modes,

                    datasets:[{

                        data:questionData

                    }]

                },

                options:{

                    responsive:true,

                    maintainAspectRatio:false

                }

            }

        );

}


// =========================
// 日付変更
// =========================

document
    .getElementById("modeStart")
    .addEventListener(
        "change",
        loadModeData
    );


document
    .getElementById("modeEnd")
    .addEventListener(
        "change",
        loadModeData
    );


// =========================
// 初回読み込み
// =========================

loadModeData();

</script>

</body>

</html>
