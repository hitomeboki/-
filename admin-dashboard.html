<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ひとめぼき道場 管理ダッシュボード</title>

<style>

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;

    background:#f5f5f5;

    margin:0;
    padding:30px 20px;

    color:#222;
}

.container{
    max-width:900px;
    margin:0 auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.stats{
    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:16px;
}

.card{
    background:white;

    border-radius:16px;

    padding:22px;

    box-shadow:
    0 3px 12px
    rgba(0,0,0,0.08);
}

.card h2{
    font-size:16px;

    margin:0 0 10px;

    color:#666;
}

.number{
    font-size:32px;

    font-weight:bold;
}

@media(max-width:600px){

    body{
        padding:20px 14px;
    }

    .stats{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>

<div class="container">

<h1>ひとめぼき道場 管理ダッシュボード</h1>

<button id="logoutBtn">
    ログアウト
</button>

<style>

#logoutBtn{
    display:block;
    margin:0 auto 25px;
    padding:10px 20px;
    border:none;
    border-radius:10px;
    background:#222;
    color:white;
    font-size:15px;
    cursor:pointer;
}

</style>

<p id="lastUpdated" style="text-align:center;color:#666;margin-bottom:25px;">
    データを読み込み中…
</p>

<div class="stats">


<div class="card">
<h2>今日の利用者</h2>
<div class="number" id="todayUsers">-</div>
</div>


<div class="card">
<h2>今日の学習記録</h2>
<div class="number" id="todayRecords">-</div>
</div>


<div class="card">
<h2>昨日の利用者</h2>
<div class="number" id="yesterdayUsers">-</div>
</div>


<div class="card">
<h2>昨日の学習記録</h2>
<div class="number" id="yesterdayRecords">-</div>
</div>


<div class="card">
<h2>今週の利用者</h2>
<div class="number" id="weekUsers">-</div>
</div>


<div class="card">
<h2>今週の学習記録</h2>
<div class="number" id="weekRecords">-</div>
</div>


<div class="card">
<h2>今月の利用者</h2>
<div class="number" id="monthUsers">-</div>
</div>


<div class="card">
<h2>今月の学習記録</h2>
<div class="number" id="monthRecords">-</div>
</div>


<div class="card">
<h2>累計利用者</h2>
<div class="number" id="totalUsers">-</div>
</div>


<div class="card">
<h2>累計問題数</h2>
<div class="number" id="totalQuestions">-</div>
</div>


<div class="card">
<h2>累計正解数</h2>
<div class="number" id="totalCorrect">-</div>
</div>

<div class="card">
<h2>累計正解率</h2>
<div class="number" id="totalAccuracy">-</div>
</div>

</div>

</div>

<script>

const SUPABASE_URL =
"https://atntpiskoizpysukygcb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_y1wlMl-CRMTt-6us0M-P4Q_8OPouULn";


const token =
localStorage.getItem("admin_access_token");


if(!token){

    location.href = "admin.html";

}


async function loadDashboard(){

    try{

        const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/admin_period_stats?select=*`,
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                    `Bearer ${token}`
                }
            }
        );


        if(!response.ok){

            throw new Error(
                "データ取得に失敗しました"
            );

        }


        const data =
        await response.json();


        const stats =
        data[0];


        document.getElementById(
            "todayUsers"
        ).textContent =
        stats.today_users;


        document.getElementById(
            "todayRecords"
        ).textContent =
        stats.today_records;


        document.getElementById(
            "yesterdayUsers"
        ).textContent =
        stats.yesterday_users;


        document.getElementById(
            "yesterdayRecords"
        ).textContent =
        stats.yesterday_records;


        document.getElementById(
            "weekUsers"
        ).textContent =
        stats.week_users;


        document.getElementById(
            "weekRecords"
        ).textContent =
        stats.week_records;


        document.getElementById(
            "monthUsers"
        ).textContent =
        stats.month_users;


        document.getElementById(
            "monthRecords"
        ).textContent =
        stats.month_records;


        document.getElementById(
            "totalUsers"
        ).textContent =
        stats.total_users;


        document.getElementById(
            "totalQuestions"
        ).textContent =
        stats.total_questions;


        document.getElementById(
            "totalCorrect"
        ).textContent =
        stats.total_correct;

        const accuracy =
stats.total_questions > 0
? (stats.total_correct / stats.total_questions * 100).toFixed(1)
: 0;

document.getElementById(
    "totalAccuracy"
).textContent =
accuracy + "%";

document.getElementById(
    "lastUpdated"
).textContent =
"最終更新：" +
new Date().toLocaleString("ja-JP");

    }catch(error){

        console.error(error);

        alert(
            "データの読み込みに失敗しました"
        );

    }

}

loadDashboard();

</script>

<script>

document.getElementById(
    "logoutBtn"
).addEventListener(
    "click",
    function(){

        localStorage.removeItem(
            "admin_access_token"
        );

        location.href =
        "admin.html";

    }
);

</script>

</body>

</html>
