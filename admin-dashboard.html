<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ひとめぼき道場 管理ダッシュボード</title>

<style>

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;

    background:#f5f5f5;

    margin:0;
    padding:30px 20px;

    color:#222;
}

.container{
    max-width:900px;
    margin:0 auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.menu{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
    margin:35px auto 0;
}

.menu-btn{
    display:flex;
    align-items:center;
    justify-content:center;

    min-height:90px;

    background:white;

    border-radius:16px;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,0.08);

    text-decoration:none;

    color:#222;

    font-size:18px;
    font-weight:bold;

    transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;
}

.menu-btn:active{
    transform:scale(0.98);
}

.menu-btn:nth-child(4){
    grid-column:1 / 2;
}

.menu-btn:nth-child(5){
    grid-column:2 / 3;
}

@media(max-width:600px){

    .menu{
        grid-template-columns:1fr;
        gap:14px;
        margin-top:30px;
    }

    .menu-btn{
        min-height:72px;
        font-size:17px;
    }

    .menu-btn:nth-child(4),
    .menu-btn:nth-child(5){
        grid-column:auto;
    }

}

@media(max-width:600px){

    body{
        padding:20px 14px;
    }

}
</style>

</head>


<body>

<div class="container">

<h1>ひとめぼき道場 管理ダッシュボード</h1>

<p id="lastUpdated" style="text-align:center;color:#666;margin-bottom:25px;">
    データを読み込み中…
</p>

        🎯 モード別分析

    <a href="admin-weak.html" class="menu-btn">
        📕 苦手分析
    </a>

</div>

<script>

const SUPABASE_URL =
"https://atntpiskoizpysukygcb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_y1wlMl-CRMTt-6us0M-P4Q_8OPouULn";


const token =
localStorage.getItem("admin_access_token");


if(!token){

    location.href = "admin.html";

}


// =========================
// ログイン状態確認
// =========================

async function checkAdminSession(){

    try{

        const response =
        await fetch(
            `${SUPABASE_URL}/auth/v1/user`,
            {
                headers:{
                    "apikey":SUPABASE_KEY,
                    "Authorization":
                    `Bearer ${token}`
                }
            }
        );


        if(!response.ok){

            localStorage.removeItem(
                "admin_access_token"
            );

            location.href =
                "admin.html";

            return false;

        }

        return true;

    }catch(error){

        console.error(error);

        return false;

    }

}
checkAdminSession();

</script>
