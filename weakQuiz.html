<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>苦手克服　一問一答</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="easy-mode">

<div class="top-container">

<h1>🔥　苦手克服　一問一答</h1>

<div class="progress-tag" id="progressTag">
問題 1 / 23
</div>

<div class="question-card">

<h2 id="question"></h2>

<div class="answer-area" id="answerArea">

<button class="asset answer-btn"
onclick="checkAnswer('資産')">
📁<br>
<span>資産</span>
</button>

<button class="liability answer-btn"
onclick="checkAnswer('負債')">
🏦<br>
<span>負債</span>
</button>

<button class="equity answer-btn"
onclick="checkAnswer('純資産')">
🌱<br>
<span>純資産</span>
</button>

<button class="expense answer-btn"
onclick="checkAnswer('費用')">
📈<br>
<span>費用</span>
</button>

<button class="revenue answer-btn"
onclick="checkAnswer('収益')">
💴<br>
<span>収益</span>
</button>

<button id="otherBtn"
class="other answer-btn"
onclick="checkAnswer('その他')"
style="display:none;">
📌<br>
<span>その他</span>
</button>

</div>


<!-- =========================
     結果オーバーレイ
========================= -->

<div id="resultOverlay">

    <div id="resultBox">

        <div id="resultMain"></div>

        <div id="resultExplanation"></div>

        <button id="overlayNextBtn"
                onclick="nextQuestion()">
            次の問題へ →
        </button>

        <button id="finishBtn"
                onclick="finishQuiz()">
            ✕ 終了する
        </button>

    </div>

</div>


<!-- =========================
     回答前の終了ボタン
========================= -->

<button id="quitBtn"
        onclick="finishQuiz()">
    ✕ 終了する
</button>


</div>


<script src="data.js"></script>
<script src="study.js"></script>

<script>

// =========================
// 苦手問題だけ取得
// =========================

let weakQuiz =
    JSON.parse(
        localStorage.getItem("weakQuiz")
    ) || [];


// =========================
// 問題名を取得
// =========================

const questionNames =
    weakQuiz.map(item => {

        return item.replace(
            "は何に分類される？",
            ""
        );

    });


// =========================
// 問題データ作成
// =========================

const questions =
    questionNames.map(name => ({

        question:
            `${name}は何に分類される？`,

        answer:
            accounts[name].category,

        explanation:
            accounts[name].explanation

    }));


// =========================
// その他表示判定
// =========================

let hasOther =
    questions.some(
        q => q.answer === "その他"
    );


if(hasOther){

    document.getElementById("otherBtn")
        .style.display = "inline-block";

    document
        .querySelector(".answer-area")
        .classList.add("has-other");

}


// =========================
// 問題をランダムにする
// =========================

questions.sort(
    () => Math.random() - 0.5
);


// =========================
// 変数
// =========================

let currentQuestion = 0;

let score = 0;

// 実際に回答した問題数
let answeredCount = 0;

// 連続正解記録
let weakCorrect =
    JSON.parse(
        localStorage.getItem("weakCorrect")
    ) || {};


// =========================
// 苦手問題がない場合
// =========================

if(questions.length === 0){

    document.body.innerHTML = `

    <div class="top-container">

        <h1>🔥 苦手克服 一問一答</h1>

        <h2>🎉 苦手問題はありません！</h2>

        <p>
        通常モードで問題を解いて<br>
        苦手を作るとここに表示されます。
        </p>

        <br>

        <a href="index.html">
            <button>
                🏠 トップへ戻る
            </button>
        </a>

    </div>

    `;

}else{

    showQuestion();

}


// =========================
// 問題表示
// =========================

function showQuestion(){

    document.getElementById("progressTag")
        .innerHTML =
        "問題 " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    document.getElementById("question")
        .innerHTML =
        questions[currentQuestion].question;


    // 結果画面を閉じる
    document.getElementById("resultOverlay")
        .style.display = "none";


    // 回答ボタンを有効化
    const buttons =
        document.querySelectorAll(
            ".asset, .liability, .equity, .expense, .revenue, .other"
        );


    buttons.forEach(button => {

        button.disabled = false;

    });

}


// =========================
// 回答
// =========================

function checkAnswer(answer){

    const q =
        questions[currentQuestion];


    const correct =
        answer === q.answer;


    // 実際に回答した問題数を増やす
    answeredCount++;


    // =========================
    // 学習記録
    // =========================

    saveStudyRecord(
    1,
    correct ? 1 : 0,
    "苦手克服"
);


    // =========================
    // 正解
    // =========================

    if(correct){

        document.getElementById("resultMain")
            .innerHTML =
            "⭕ 正解！！";


        document.getElementById("resultMain")
            .className =
            "result-correct";


        document.getElementById("resultExplanation")
            .innerHTML =
            "<strong>解説</strong><br><br>" +
            q.explanation;


        score++;


        // =========================
        // 連続正解
        // =========================

        const name =
            q.question.replace(
                "は何に分類される？",
                ""
            );


        weakCorrect[name] =
            (weakCorrect[name] || 0) + 1;


        // =========================
        // 3回連続正解
        // =========================

        if(weakCorrect[name] >= 3){

            let currentWeakQuiz =
                JSON.parse(
                    localStorage.getItem("weakQuiz")
                ) || [];


            currentWeakQuiz =
                currentWeakQuiz.filter(
                    item => item !== name
                );


            localStorage.setItem(
                "weakQuiz",
                JSON.stringify(currentWeakQuiz)
            );


            delete weakCorrect[name];

        }


        localStorage.setItem(
            "weakCorrect",
            JSON.stringify(weakCorrect)
        );

    }


    // =========================
    // 不正解
    // =========================

    else{

        document.getElementById("resultMain")
            .innerHTML =
            "❌ 不正解";


        document.getElementById("resultMain")
            .className =
            "result-wrong";


        document.getElementById("resultExplanation")
            .innerHTML =
            "<strong>正解：" +
            q.answer +
            "</strong><br><br>" +
            "<strong>解説</strong><br><br>" +
            q.explanation;


        const name =
            q.question.replace(
                "は何に分類される？",
                ""
            );


        // =========================
        // 連続正解をリセット
        // =========================

        weakCorrect[name] = 0;


        localStorage.setItem(
            "weakCorrect",
            JSON.stringify(weakCorrect)
        );


        // =========================
        // 苦手問題として保存
        // =========================

        let currentWeakQuiz =
            JSON.parse(
                localStorage.getItem("weakQuiz")
            ) || [];


        if(!currentWeakQuiz.includes(name)){

            currentWeakQuiz.push(name);

        }


        localStorage.setItem(
            "weakQuiz",
            JSON.stringify(currentWeakQuiz)
        );

    }


    // =========================
    // 回答ボタン無効化
    // =========================

    const buttons =
        document.querySelectorAll(
            ".asset, .liability, .equity, .expense, .revenue, .other"
        );


    buttons.forEach(button => {

        button.disabled = true;

    });


    // =========================
    // 次のボタン
    // =========================

    if(
        currentQuestion ===
        questions.length - 1
    ){

        document.getElementById(
            "overlayNextBtn"
        ).innerHTML =
            "結果を見る →";

    }else{

        document.getElementById(
            "overlayNextBtn"
        ).innerHTML =
            "次の問題へ →";

    }


    // =========================
    // 結果オーバーレイ表示
    // =========================

    document.getElementById(
        "resultOverlay"
    ).style.display = "flex";

}


// =========================
// 次の問題
// =========================

function nextQuestion(){

    currentQuestion++;


    if(
        currentQuestion <
        questions.length
    ){

        showQuestion();

    }else{

        showResult();

    }

}


// =========================
// 途中終了
// =========================

function finishQuiz(){

    // 1問も回答していない
    if(answeredCount === 0){

        location.href = "index.html";

        return;

    }


    showResult();

}


// =========================
// 結果発表
// =========================

function showResult(){

    // 実際に回答した問題数
    const answered =
        answeredCount;


    // 念のため
    if(answered === 0){

        location.href = "index.html";

        return;

    }


    const percentage =
        Math.round(
            score / answered * 100
        );


    let rank = "";


    if(percentage === 100){

        rank = "🏆 Sランク";

    }
    else if(percentage >= 90){

        rank = "🥇 Aランク";

    }
    else if(percentage >= 80){

        rank = "🥈 Bランク";

    }
    else if(percentage >= 70){

        rank = "🥉 Cランク";

    }
    else{

        rank = "📖 Dランク";

    }


    // =========================
    // 結果画面
    // =========================

    document.body.innerHTML = `

        <div class="top-container">

            <h1>🎯 結果発表</h1>

            <br>

            <h2>
                ${answered}問中 ${score}問正解
            </h2>

            <h2>
                正答率 ${percentage}%
            </h2>

            <h2>
                ${rank}
            </h2>

            <br><br>

            <a href="index.html">

                <button class="menu-btn weak">
                    🏠 トップへ戻る
                </button>

            </a>

        </div>

    `;

}

</script>

</body>
</html>
