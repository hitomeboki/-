<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>一問一答 | ひとめぼき道場</title>

    <link rel="stylesheet" href="style.css">
</head>


<body class="quiz-page">

<div class="app-container">


    <!-- ヘッダー -->

    <header class="page-header">

        <a href="index.html" class="back-link">
            ← トップへ戻る
        </a>

        <div class="page-brand">
            📖 ひとめぼき道場
        </div>

    </header>


    <!-- メイン -->

    <main class="quiz-main">


        <!-- タイトル -->

        <div class="quiz-title-area">

            <div class="page-label">
                QUIZ MODE
            </div>

            <h1>一問一答</h1>

            <p>
                勘定科目を正しい分類に分けよう
            </p>

        </div>


        <!-- 問題カード -->

        <section class="quiz-card">


            <!-- 進捗 -->

            <div class="quiz-progress">

                <span class="progress-label">
                    PROGRESS
                </span>

                <span class="progress-tag" id="progressTag">
                    問題 1 / 23
                </span>

            </div>


            <!-- 問題 -->

            <div class="question-area">

                <p class="question-label">
                    QUESTION
                </p>

                <h2 id="question"></h2>

            </div>


            <!-- 回答 -->

            <div class="answer-area" id="answerArea">

                <button class="asset answer-btn" onclick="checkAnswer('資産')">

                    <span class="answer-icon">📁</span>

                    <span>資産</span>

                </button>


                <button class="liability answer-btn" onclick="checkAnswer('負債')">

                    <span class="answer-icon">🏦</span>

                    <span>負債</span>

                </button>


                <button class="equity answer-btn" onclick="checkAnswer('純資産')">

                    <span class="answer-icon">🌱</span>

                    <span>純資産</span>

                </button>


                <button class="expense answer-btn" onclick="checkAnswer('費用')">

                    <span class="answer-icon">📈</span>

                    <span>費用</span>

                </button>


                <button class="revenue answer-btn" onclick="checkAnswer('収益')">

                    <span class="answer-icon">💴</span>

                    <span>収益</span>

                </button>


                <button
                    id="otherBtn"
                    class="other answer-btn"
                    onclick="checkAnswer('その他')"
                    style="display:none;">

                    <span class="answer-icon">📌</span>

                    <span>その他</span>

                </button>

            </div>


            <!-- 結果 -->

            <div id="result" class="quiz-result"></div>


            <!-- 次へ -->

            <button
                id="nextBtn"
                class="next-question-btn"
                onclick="nextQuestion()"
                style="display:none;">

                次の問題へ →

            </button>


        </section>


    </main>

</div>


<script src="data.js"></script>
<script src="study.js"></script>


<script>

/* =========================
   モード取得
========================= */

const params = new URLSearchParams(window.location.search);

const mode = params.get("mode");


if(mode === "easy"){

    document.body.classList.add("easy-mode");

}else{

    document.body.classList.add("hard-mode");

}


/* その他 */

if(mode !== "easy"){

    document.getElementById("otherBtn").style.display = "inline-block";

    document
        .querySelector(".answer-area")
        .classList
        .add("has-other");

}


/* =========================
   出題する勘定科目
========================= */

const questionNames = Object.keys(accounts).filter(name => {

    if(mode === "easy"){

        return accounts[name].easy;

    }

    return true;

});


/* =========================
   問題作成
========================= */

const questions = questionNames.map(name => ({

    question: `${name}は何に分類される？`,

    answer: accounts[name].category,

    explanation: accounts[name].explanation

}));


/* 順番ランダム */

questions.sort(() => Math.random() - 0.5);


/* =========================
   変数
========================= */

let currentQuestion = 0;

let score = 0;

let weakCorrect =
JSON.parse(localStorage.getItem("weakCorrect")) || {};


/* =========================
   最初の問題
========================= */

showQuestion();


/* =========================
   問題表示
========================= */

function showQuestion(){

    document.getElementById("progressTag").innerHTML =

        "問題 " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    document.getElementById("question").innerHTML =

        questions[currentQuestion].question;


    document.getElementById("result").innerHTML = "";


    document.getElementById("nextBtn").style.display =

        "none";


    const buttons = document.querySelectorAll(

        ".asset, .liability, .equity, .expense, .revenue, .other"

    );


    buttons.forEach(button => {

        button.disabled = false;

    });

}


/* =========================
   回答チェック
========================= */

function checkAnswer(answer){

    const q = questions[currentQuestion];

    let correct = answer === q.answer;


    saveStudyRecord(

        1,

        correct ? 1 : 0

    );


    /* 正解 */

    if(answer === q.answer){


        document.getElementById("result").innerHTML =

            `
            <div class="result-correct">

                <div class="result-title">
                    ⭕ 正解！
                </div>

                <div class="result-explanation">
                    💡 ${q.explanation}
                </div>

            </div>
            `;


        score++;


        let name = q.question.replace(

            "は何に分類される？",

            ""

        );


        weakCorrect[name] =

            (weakCorrect[name] || 0) + 1;


        /* 3回正解したら削除 */

        if(weakCorrect[name] >= 3){


            let weakQuiz =

                JSON.parse(
                    localStorage.getItem("weakQuiz")
                ) || [];


            weakQuiz = weakQuiz.filter(item =>

                item !== name

            );


            localStorage.setItem(

                "weakQuiz",

                JSON.stringify(weakQuiz)

            );


            delete weakCorrect[name];

        }


        localStorage.setItem(

            "weakCorrect",

            JSON.stringify(weakCorrect)

        );


    }


    /* 不正解 */

    else{


        document.getElementById("result").innerHTML =

            `
            <div class="result-wrong">

                <div class="result-title">
                    ❌ 不正解
                </div>

                <div class="correct-category">

                    正解：${q.answer}

                </div>

                <div class="result-explanation">

                    💡 ${q.explanation}

                </div>

            </div>
            `;


        let name = q.question.replace(

            "は何に分類される？",

            ""

        );


        /* 一問一答の苦手 */

        let weakQuiz =

            JSON.parse(
                localStorage.getItem("weakQuiz")
            ) || [];


        if(!weakQuiz.includes(name)){

            weakQuiz.push(name);

        }


        localStorage.setItem(

            "weakQuiz",

            JSON.stringify(weakQuiz)

        );


        /* 分類の苦手 */

        let weakClassify =

            JSON.parse(
                localStorage.getItem("weakClassify")
            ) || [];


        if(!weakClassify.includes(name)){

            weakClassify.push(name);

        }


        localStorage.setItem(

            "weakClassify",

            JSON.stringify(weakClassify)

        );

    }


    document.getElementById("nextBtn").style.display =

        "inline-block";


    const buttons = document.querySelectorAll(

        ".asset, .liability, .equity, .expense, .revenue, .other"

    );


    buttons.forEach(button => {

        button.disabled = true;

    });

}


/* =========================
   次の問題
========================= */

function nextQuestion(){

    currentQuestion++;


    if(currentQuestion < questions.length){

        showQuestion();

    }


    else{


        let percentage =

            Math.round(

                score / questions.length * 100

            );


        let rank = "";


        if(percentage === 100){

            rank = "🏆 Sランク";

        }

        else if(percentage >= 90){

            rank = "🥇 Aランク";

        }

        else if(percentage >= 80){

            rank = "🥈 Bランク";

        }

        else if(percentage >= 70){

            rank = "🥉 Cランク";

        }

        else{

            rank = "📖 Dランク";

        }


        document.body.innerHTML = `

        <div class="result-page">

            <div class="result-summary-card">

                <div class="page-label">
                    RESULT
                </div>

                <h1>結果発表</h1>

                <div class="score-circle">

                    ${percentage}%

                </div>

                <h2>
                    ${score} / ${questions.length}問正解
                </h2>

                <h2>
                    ${rank}
                </h2>

                <a href="index.html">

                    <button class="result-home-btn">

                        トップへ戻る

                    </button>

                </a>

            </div>

        </div>

        `;

    }

}

</script>

</body>

</html>
