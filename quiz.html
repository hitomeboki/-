<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>一問一答モード</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="top-container">

<h1>🎯 一問一答モード</h1>

<div class="progress-tag" id="progressTag">
問題 1 / 23
</div>

<div class="question-card">

<h2 id="question"></h2>

<div class="answer-area" id="answerArea">

<button class="asset answer-btn" onclick="checkAnswer('資産')">
📁<br>
<span>資産</span>
</button>

<button class="liability answer-btn" onclick="checkAnswer('負債')">
🏦<br>
<span>負債</span>
</button>

<button class="equity answer-btn" onclick="checkAnswer('純資産')">
🌱<br>
<span>純資産</span>
</button>

<button class="expense answer-btn" onclick="checkAnswer('費用')">
📈<br>
<span>費用</span>
</button>

<button class="revenue answer-btn" onclick="checkAnswer('収益')">
💴<br>
<span>収益</span>
</button>

<button id="otherBtn"
class="other answer-btn"
onclick="checkAnswer('その他')"
style="display:none;">
📌<br>
<span>その他</span>
</button>

</div>


<!-- =========================
     結果オーバーレイ
========================= -->

<div id="resultOverlay">

    <div id="resultBox">

        <div id="resultMain"></div>

        <div id="resultExplanation"></div>

        <button id="overlayNextBtn"
                onclick="nextQuestion()">
            次の問題へ →
        </button>

        <button id="finishBtn"
                onclick="finishQuiz()">
            ✕ 終了する
        </button>

    </div>

</div>


<!-- 途中で終了するボタン -->

<button id="quitBtn" onclick="finishQuiz()">
    ✕ 終了する
</button>


</div>


<script src="data.js"></script>
<script src="study.js"></script>

<script>

// =========================
// URLからモードを取得
// =========================

const params = new URLSearchParams(window.location.search);
const mode = params.get("mode");

if(mode === "easy"){
    document.body.classList.add("easy-mode");
}else{
    document.body.classList.add("hard-mode");
}

console.log(document.body.className);
console.log(mode);


// =========================
// その他ボタン
// =========================

if (mode !== "easy") {

    document.getElementById("otherBtn").style.display =
        "inline-block";

    document
        .querySelector(".answer-area")
        .classList.add("has-other");
}


// =========================
// 問題を決定
// =========================

const questionNames =
    Object.keys(accounts).filter(name => {

        if (mode === "easy") {
            return accounts[name].easy;
        }

        return true;

    });


// =========================
// 問題データ
// =========================

const questions =
    questionNames.map(name => ({

        question:
            `${name}は何に分類される？`,

        answer:
            accounts[name].category,

        explanation:
            accounts[name].explanation

    }));


// 順番だけランダム
questions.sort(() => Math.random() - 0.5);


console.log("mode =", mode);
console.log("questions =", questions.length);
console.log(questions);


let currentQuestion = 0;
let score = 0;
let answeredCount = 0;

let weakCorrect =
    JSON.parse(
        localStorage.getItem("weakCorrect")
    ) || {};


// =========================
// 最初の問題
// =========================

showQuestion();


// =========================
// 問題表示
// =========================

function showQuestion() {

    document.getElementById("progressTag").innerHTML =
        "問題 " +
        (currentQuestion + 1) +
        " / " +
        questions.length;


    document.getElementById("question").innerHTML =
        questions[currentQuestion].question;


    // 結果画面を閉じる
    document.getElementById("resultOverlay").style.display =
        "none";


    // 回答ボタンを有効化
    const buttons =
        document.querySelectorAll(
            ".asset, .liability, .equity, .expense, .revenue, .other"
        );


    buttons.forEach(button => {
        button.disabled = false;
    });

}


// =========================
// 回答
// =========================

function checkAnswer(answer) {

    const q = questions[currentQuestion];

    const correct =
        answer === q.answer;

    answeredCount++;
    // 学習記録
    saveStudyRecord(
        1,
        correct ? 1 : 0
    );

    sendAnswerToSupabase(
    q.question.replace(
        "は何に分類される？",
        ""
    ),
    q.answer,
    correct,
    "一問一答"
);


    // =========================
    // 正解
    // =========================

    if (correct) {

        document.getElementById("resultMain").innerHTML =
            "⭕ 正解！！";

        document.getElementById("resultMain").className =
            "result-correct";


        document.getElementById("resultExplanation").innerHTML =
            "<strong>解説</strong><br><br>" +
            q.explanation;


        score++;


        // 苦手克服
        const name =
            q.question.replace(
                "は何に分類される？",
                ""
            );


        weakCorrect[name] =
            (weakCorrect[name] || 0) + 1;


        // 3回連続正解
        if(weakCorrect[name] >= 3){

            let weakQuiz =
                JSON.parse(
                    localStorage.getItem("weakQuiz")
                ) || [];


            weakQuiz =
                weakQuiz.filter(item =>
                    item !== name
                );


            localStorage.setItem(
                "weakQuiz",
                JSON.stringify(weakQuiz)
            );


            delete weakCorrect[name];
        }


        localStorage.setItem(
            "weakCorrect",
            JSON.stringify(weakCorrect)
        );

    }


    // =========================
    // 不正解
    // =========================

    else {

        document.getElementById("resultMain").innerHTML =
            "❌ 不正解";

        document.getElementById("resultMain").className =
            "result-wrong";


        document.getElementById("resultExplanation").innerHTML =
            "<strong>正解：" +
            q.answer +
            "</strong><br><br>" +
            "<strong>解説</strong><br><br>" +
            q.explanation;


        // =========================
        // 苦手問題
        // =========================

        const name =
            q.question.replace(
                "は何に分類される？",
                ""
            );


        let weakQuiz =
            JSON.parse(
                localStorage.getItem("weakQuiz")
            ) || [];


        if(!weakQuiz.includes(name)){

            weakQuiz.push(name);

        }


        localStorage.setItem(
            "weakQuiz",
            JSON.stringify(weakQuiz)
        );


        let weakClassify =
            JSON.parse(
                localStorage.getItem("weakClassify")
            ) || [];


        if(!weakClassify.includes(name)){

            weakClassify.push(name);

        }


        localStorage.setItem(
            "weakClassify",
            JSON.stringify(weakClassify)
        );

    }


    // =========================
    // 回答ボタンを無効化
    // =========================

    const buttons =
        document.querySelectorAll(
            ".asset, .liability, .equity, .expense, .revenue, .other"
        );


    buttons.forEach(button => {
        button.disabled = true;
    });


    // =========================
    // 最後の問題か
    // =========================

    if(currentQuestion === questions.length - 1){

        document.getElementById("overlayNextBtn").innerHTML =
            "結果を見る →";

    }else{

        document.getElementById("overlayNextBtn").innerHTML =
            "次の問題へ →";

    }


    // 結果を表示
    document.getElementById("resultOverlay").style.display =
        "flex";

}


// =========================
// 次の問題
// =========================

function nextQuestion() {

    currentQuestion++;


    if(currentQuestion < questions.length){

        showQuestion();

    }else{

        showResult();

    }

}

function finishQuiz() {

    // まだ1問も回答していない場合
    if(answeredCount === 0){

        // そのままトップへ
        location.href = "index.html";

        return;
    }


    showResult();

}


// =========================
// 結果発表
// =========================

function showResult() {

    // 実際に回答した問題数
    const answered =
    answeredCount;


    // 念のため0問防止
    if(answered === 0){

        location.href = "index.html";

        return;

    }


    const percentage =
        Math.round(
            score / answered * 100
        );


    let rank = "";


    if(percentage === 100){

        rank = "🏆 Sランク";

    }
    else if(percentage >= 90){

        rank = "🥇 Aランク";

    }
    else if(percentage >= 80){

        rank = "🥈 Bランク";

    }
    else if(percentage >= 70){

        rank = "🥉 Cランク";

    }
    else{

        rank = "📖 Dランク";

    }


    document.body.innerHTML = `

        <div class="top-container">

            <h1>🎯 結果発表</h1>

            <br>

            <h2>
                ${answered}問中 ${score}問正解
            </h2>

            <h2>
                正答率 ${percentage}%
            </h2>

            <h2>
                ${rank}
            </h2>

            <br><br>

            <a href="index.html">

                <button class="menu-btn easy">
                    🏠 トップへ戻る
                </button>

            </a>

        </div>

    `;

}

</script>

</body>
</html>
