<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ひとめぼき道場 管理画面</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>

        .learning-card{
            max-width:1000px;
            margin:30px auto;
            padding:30px;
            background:white;
            border-radius:16px;
            box-shadow:0 3px 12px rgba(0,0,0,0.08);
        }

        .learning-card h2{
            margin-top:0;
            margin-bottom:25px;
        }

        .learning-stats{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
        }

        .learning-stats div{
            padding:20px;
            background:#f5f5f5;
            border-radius:12px;
            text-align:center;
        }

        .learning-stats span{
            display:block;
            font-size:15px;
            margin-bottom:10px;
        }

        .learning-stats strong{
            display:block;
            font-size:28px;
        }

    </style>
</head>

<body>

<h1>📚 学習状況</h1>

<section class="learning-card">

    <h2>📊 全体の学習状況</h2>

    <div class="learning-stats">

        <div>
            <span>総問題数</span>
            <strong id="totalQuestions">-</strong>
        </div>

        <div>
            <span>総正解数</span>
            <strong id="totalCorrect">-</strong>
        </div>

        <div>
            <span>総不正解数</span>
            <strong id="totalIncorrect">-</strong>
        </div>

        <div>
            <span>全体正解率</span>
            <strong id="totalAccuracy">-</strong>
        </div>

    </div>

</section>

<section class="learning-card">

    <h2>📈 1回あたりの学習状況</h2>

    <div class="learning-stats">

        <div>
            <span>1回平均問題数</span>
            <strong id="avgQuestions">-</strong>
        </div>

        <div>
            <span>1回平均正解数</span>
            <strong id="avgCorrect">-</strong>
        </div>

        <div>
            <span>1回平均正解率</span>
            <strong id="avgAccuracy">-</strong>
        </div>

    </div>

</section>

<section class="learning-card">

    <h2>📅 期間指定</h2>

    <div class="period-inputs">

        <input
            type="date"
            id="learningStart"
        >

        <span>〜</span>

        <input
            type="date"
            id="learningEnd"
        >

    </div>

    <div id="learningPeriodResult">

        <p>期間を選択してください。</p>

    </div>

</section>

<section class="learning-card">

    <h2>📈 学習量の推移</h2>

    <div class="chart-inputs">

        <input
            type="date"
            id="chartStart"
        >

        <span>〜</span>

        <input
            type="date"
            id="chartEnd"
        >

    </div>

    <canvas id="learningChart"></canvas>

</section>

<script>

const SUPABASE_URL =
"https://atntpiskoizpysukygcb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_y1wlMl-CRMTt-6us0M-P4Q_8OPouULn";

const token =
localStorage.getItem("admin_access_token");


async function loadLearningStats(){

    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/get_learning_stats`,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );


    const data =
        await response.json();


    if(!response.ok){

        console.error(
            "学習状況取得エラー：",
            data
        );

        return;
    }


    const result =
        data[0];


    document.getElementById(
        "totalQuestions"
    ).textContent =
        result.total_questions + "問";


    document.getElementById(
        "totalCorrect"
    ).textContent =
        result.total_correct + "問";


    document.getElementById(
        "totalIncorrect"
    ).textContent =
        result.total_incorrect + "問";


    document.getElementById(
        "totalAccuracy"
    ).textContent =
        Number(
            result.total_accuracy
        ).toFixed(1) + "%";

}

async function loadLearningAverage(){

    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/get_learning_average`,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );


    const data =
        await response.json();


    if(!response.ok){

        console.error(
            "平均学習状況取得エラー：",
            data
        );

        return;
    }


    const result =
        data[0];


    document.getElementById(
        "avgQuestions"
    ).textContent =
        Number(
            result.avg_questions
        ).toFixed(1) + "問";


    document.getElementById(
        "avgCorrect"
    ).textContent =
        Number(
            result.avg_correct
        ).toFixed(1) + "問";


    document.getElementById(
        "avgAccuracy"
    ).textContent =
        Number(
            result.avg_accuracy
        ).toFixed(1) + "%";

}


loadLearningAverage();

loadLearningStats();

async function loadLearningPeriod(){

    const start =
        document.getElementById(
            "learningStart"
        ).value;

    const end =
        document.getElementById(
            "learningEnd"
        ).value;


    if(!start || !end){

        return;
    }


    if(start > end){

        document.getElementById(
            "learningPeriodResult"
        ).innerHTML =
            "<p>開始日は終了日より前にしてください。</p>";

        return;
    }


    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/get_learning_period`,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${token}`
                },

                body:JSON.stringify({
                    start_date:start,
                    end_date:end
                })
            }
        );


    const data =
        await response.json();


    if(!response.ok){

        console.error(
            "期間学習状況取得エラー：",
            data
        );

        return;
    }


    const result =
        data[0];


    document.getElementById(
        "learningPeriodResult"
    ).innerHTML = `

        <p>
            総問題数：
            <strong>
                ${result.total_questions}問
            </strong>
        </p>

        <p>
            総正解数：
            <strong>
                ${result.total_correct}問
            </strong>
        </p>

        <p>
            総不正解数：
            <strong>
                ${result.total_incorrect}問
            </strong>
        </p>

        <p>
            正解率：
            <strong>
                ${Number(result.total_accuracy).toFixed(1)}%
            </strong>
        </p>

    `;
}


document.getElementById(
    "learningStart"
).addEventListener(
    "change",
    loadLearningPeriod
);


document.getElementById(
    "learningEnd"
).addEventListener(
    "change",
    loadLearningPeriod
);

async function loadLearningChart(){

    const start =
        document.getElementById(
            "chartStart"
        ).value;

    const end =
        document.getElementById(
            "chartEnd"
        ).value;


    if(!start || !end){

        return;
    }


    if(start > end){

        return;
    }


    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/get_learning_daily_stats`,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${token}`
                },

                body:JSON.stringify({
                    start_date:start,
                    end_date:end
                })
            }
        );


    const data =
        await response.json();


    if(!response.ok){

        console.error(
            "学習推移取得エラー：",
            data
        );

        return;
    }


    const canvas =
        document.getElementById(
            "learningChart"
        );

    const ctx =
        canvas.getContext("2d");


    if(window.learningChartInstance){

        window.learningChartInstance.destroy();

    }


    window.learningChartInstance =
        new Chart(
            ctx,
            {
                type:"line",

                data:{
                    labels:
                        data.map(
                            item =>
                                item.study_date
                        ),

                    datasets:[

                        {
                            label:"総問題数",

                            data:
                                data.map(
                                    item =>
                                        item.questions
                                ),

                            borderWidth:2,

                            tension:0.3
                        },

                        {
                            label:"総正解数",

                            data:
                                data.map(
                                    item =>
                                        item.correct
                                ),

                            borderWidth:2,

                            tension:0.3
                        }

                    ]
                },

                options:{
                    responsive:true,

                    maintainAspectRatio:true,

                    scales:{
                        y:{
                            beginAtZero:true
                        }
                    }
                }
            }
        );
}


document.getElementById(
    "chartStart"
).addEventListener(
    "change",
    loadLearningChart
);


document.getElementById(
    "chartEnd"
).addEventListener(
    "change",
    loadLearningChart
);

</script>
</body>
</html>
