<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>ひとめぼき道場 管理画面</title>

    <style>

        .learning-card{
            max-width:1000px;
            margin:30px auto;
            padding:30px;
            background:white;
            border-radius:16px;
            box-shadow:0 3px 12px rgba(0,0,0,0.08);
        }

        .learning-card h2{
            margin-top:0;
            margin-bottom:25px;
        }

        .learning-stats{
            display:grid;
            grid-template-columns:repeat(4,1fr);
            gap:20px;
        }

        .learning-stats div{
            padding:20px;
            background:#f5f5f5;
            border-radius:12px;
            text-align:center;
        }

        .learning-stats span{
            display:block;
            font-size:15px;
            margin-bottom:10px;
        }

        .learning-stats strong{
            display:block;
            font-size:28px;
        }

    </style>
</head>

<body>

<h1>📚 学習状況</h1>

<section class="learning-card">

    <h2>📊 全体の学習状況</h2>

    <div class="learning-stats">

        <div>
            <span>総問題数</span>
            <strong id="totalQuestions">-</strong>
        </div>

        <div>
            <span>総正解数</span>
            <strong id="totalCorrect">-</strong>
        </div>

        <div>
            <span>総不正解数</span>
            <strong id="totalIncorrect">-</strong>
        </div>

        <div>
            <span>全体正解率</span>
            <strong id="totalAccuracy">-</strong>
        </div>

    </div>

</section>

<script>

const SUPABASE_URL =
"https://atntpiskoizpysukygcb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_y1wlMl-CRMTt-6us0M-P4Q_8OPouULn";

const token =
localStorage.getItem("admin_access_token");


async function loadLearningStats(){

    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/get_learning_stats`,
            {
                method:"POST",

                headers:{
                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );


    const data =
        await response.json();


    if(!response.ok){

        console.error(
            "学習状況取得エラー：",
            data
        );

        return;
    }


    const result =
        data[0];


    document.getElementById(
        "totalQuestions"
    ).textContent =
        result.total_questions + "問";


    document.getElementById(
        "totalCorrect"
    ).textContent =
        result.total_correct + "問";


    document.getElementById(
        "totalIncorrect"
    ).textContent =
        result.total_incorrect + "問";


    document.getElementById(
        "totalAccuracy"
    ).textContent =
        Number(
            result.total_accuracy
        ).toFixed(1) + "%";

}


loadLearningStats();

</script>
</body>
</html>
