<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>利用状況 | ひとめぼき道場</title>

<style>

.calendar{
    max-width:500px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

.calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.calendar-header h2{
    margin:0;
    font-size:22px;
}

.calendar-header button{
    width:44px;
    height:44px;
    border:none;
    border-radius:10px;
    background:#f1f1f1;
    font-size:20px;
    cursor:pointer;
}

.calendar-week,
.calendar-days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
}

.calendar-week div{
    text-align:center;
    font-weight:bold;
    padding:8px 0;
}

.calendar-days button{
    min-height:44px;
    border:none;
    border-radius:10px;
    background:#f5f5f5;
    font-size:15px;
    cursor:pointer;
}

.calendar-days button:hover{
    background:#e8e8e8;
}

.calendar-days button.selected{
    background:#222;
    color:white;
}

.calendar-days button.today{
    outline:2px solid #222;
}

</style>

</head>

<body>

<h1>📊 利用状況</h1>

<div class="calendar">

    <div class="calendar-header">

        <button id="prevMonth">←</button>

        <h2 id="calendarTitle"></h2>

        <button id="nextMonth">→</button>

    </div>

    <div class="calendar-week">

        <div>日</div>
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div>土</div>

    </div>

    <div
        id="calendarDays"
        class="calendar-days">
    </div>

</div>

<div
    id="dailyResult"
    style="margin-top:20px;">

    <p>日付を選択してください。</p>

</div>

<div id="usageResult">

    <p>日付を選択してください。</p>

</div>

<div style="margin-top:25px;">

    <label>
        月：
        <input type="month" id="usageMonth">
    </label>

</div>

<div id="monthlyResult">

    <p>月を選択してください。</p>

</div>

<div style="margin-top:30px;">

    <h2>期間指定</h2>

    <label>
        開始日：
        <input type="date" id="periodStart">
    </label>

    <br><br>

    <label>
        終了日：
        <input type="date" id="periodEnd">
    </label>

</div>

<div id="periodResult">

    <p>期間を選択してください。</p>

</div>

<div style="margin-top:30px;">

    <h2>🏆 過去最高</h2>

    <div id="recordResult">

        <p>読み込み中...</p>

    </div>

</div>

<a href="admin-dashboard.html">
    ← 管理メニューに戻る
</a>

<script>

const SUPABASE_URL =
    "https://atntpiskoizpysukygcb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_y1wlMl-CRMTt-6us0M-P4Q_8OPouULn";

const token =
    localStorage.getItem("admin_access_token");


document.getElementById(
    "usageMonth"
).addEventListener(
    "change",
    async function(){

        const selectedMonth = this.value;

        if(!selectedMonth){
            return;
        }

        const [year, month] =
            selectedMonth.split("-");

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/rpc/get_monthly_usage`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        target_year:
                            Number(year),

                        target_month:
                            Number(month)
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            document.getElementById(
                "monthlyResult"
            ).innerHTML =
                "<p>データ取得に失敗しました。</p>";

            console.error(data);

            return;
        }

        const result = data[0];

        const accuracy =
            result.questions > 0
            ? (
                result.correct /
                result.questions *
                100
              ).toFixed(1)
            : "0.0";


        document.getElementById(
            "monthlyResult"
        ).innerHTML = `

            <h2>${year}年${Number(month)}月</h2>

            <p>
                利用者数：
                ${result.users}
            </p>

            <p>
                学習記録：
                ${result.records}
            </p>

            <p>
                問題数：
                ${result.questions}
            </p>

            <p>
                正解数：
                ${result.correct}
            </p>

            <p>
                正解率：
                ${accuracy}%
            </p>

        `;

    });

document.getElementById(
    "periodEnd"
).addEventListener(
    "change",
    async function(){

        const startDate =
            document.getElementById(
                "periodStart"
            ).value;

        const endDate = this.value;

        if(!startDate || !endDate){
            return;
        }

        if(startDate > endDate){

            document.getElementById(
                "periodResult"
            ).innerHTML =
                "<p>開始日は終了日より前にしてください。</p>";

            return;
        }

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/rpc/get_period_usage`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        start_date:
                            startDate,

                        end_date:
                            endDate
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            document.getElementById(
                "periodResult"
            ).innerHTML =
                "<p>データ取得に失敗しました。</p>";

            console.error(data);

            return;
        }

        const result = data[0];

        const accuracy =
            result.questions > 0
            ? (
                result.correct /
                result.questions *
                100
              ).toFixed(1)
            : "0.0";

        document.getElementById(
            "periodResult"
        ).innerHTML = `

            <h2>
                ${startDate} ～ ${endDate}
            </h2>

            <p>
                利用者数：
                ${result.users}
            </p>

            <p>
                学習記録：
                ${result.records}
            </p>

            <p>
                問題数：
                ${result.questions}
            </p>

            <p>
                正解数：
                ${result.correct}
            </p>

            <p>
                正解率：
                ${accuracy}%
            </p>

        `;

    });

async function loadAllTimeRecords(){

    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/get_all_time_records`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );

    const data =
        await response.json();

    if(!response.ok){

        document.getElementById(
            "recordResult"
        ).innerHTML =
            "<p>過去最高データの取得に失敗しました。</p>";

        console.error(data);

        return;
    }

    const result = data[0];

    document.getElementById(
        "recordResult"
    ).innerHTML = `

        <p>
            最高利用者数：
            ${result.max_users}人
            （${result.max_users_date}）
        </p>

        <p>
            最高学習記録：
            ${result.max_records}回
            （${result.max_records_date}）
        </p>

        <p>
            最高問題数：
            ${result.max_questions}問
            （${result.max_questions_date}）
        </p>

        <p>
            最高正解数：
            ${result.max_correct}問
            （${result.max_correct_date}）
        </p>

        <p>
            最高1日正解率：
            ${Number(result.max_accuracy).toFixed(1)}%
            （${result.max_accuracy_date}）
        </p>

    `;
}


loadAllTimeRecords();

</script>

</body>

</html>
