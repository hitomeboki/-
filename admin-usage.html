<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>利用状況 | ひとめぼき道場</title>

<style>

.calendar{
    max-width:1000px;
    margin:30px auto;
    background:white;
    padding:20px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

.calendar-header{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:20px;
}

.calendar-header h2{
    margin:0;
    font-size:22px;
}

.calendar-header button{
    width:44px;
    height:44px;
    border:none;
    border-radius:10px;
    background:#f1f1f1;
    font-size:20px;
    cursor:pointer;
}

.calendar-week,
.calendar-days{
    display:grid;
    grid-template-columns:repeat(7,1fr);
    gap:6px;
}

.calendar-week div{
    text-align:center;
    font-weight:bold;
    padding:8px 0;
}

.calendar-days button{
    min-height:44px;
    border:none;
    border-radius:10px;
    background:#f5f5f5;
    font-size:15px;
    cursor:pointer;
}

.calendar-days button:hover{
    background:#e8e8e8;
}

.calendar-days button.selected{
    background:#222;
    color:white;
}

.calendar-days button.today{
    outline:2px solid #222;
}

/* =========================
   利用状況レイアウト
========================= */

.usage-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:24px;
    max-width:1000px;
    margin:30px auto;
}

.usage-card{
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
    min-height:220px;
}

.usage-card h2{
    margin-top:0;
    margin-bottom:20px;
}

.period-section{
    max-width:1000px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

.period-inputs{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:15px;
    margin:20px 0;
}

.period-inputs input{
    width:260px;
    height:56px;
    padding:0 14px;
    font-size:18px;
    box-sizing:border-box;
    border:1px solid #ccc;
    border-radius:10px;
}

.period-inputs span{
    font-size:24px;
    font-weight:bold;
}

.record-section{
    max-width:1000px;
    margin:30px auto;
    background:white;
    padding:25px;
    border-radius:16px;
    box-shadow:0 3px 12px rgba(0,0,0,0.08);
}

.record-section h2{
    margin-top:0;
}

.period-section #periodResult{
    margin-top:25px;
    padding-top:20px;
    border-top:1px solid #eee;
}

.period-section #periodResult p{
    font-size:17px;
    margin:10px 0;
}

.record-section p{
    font-size:17px;
    margin:12px 0;
}

.back-btn{
    display:block;
    width:300px;
    margin:40px auto 20px;
    padding:16px;
    background:#222;
    color:white;
    text-align:center;
    text-decoration:none;
    font-size:17px;
    font-weight:bold;
    border-radius:12px;
}

.back-btn:active{
    transform:scale(0.98);
}

</style>

</head>

<body>

<h1>📊 利用状況</h1>

<h1>📊 利用状況</h1>

<!-- カレンダー -->
<div class="calendar">

    <div class="calendar-header">

        <button id="prevMonth">←</button>

        <h2 id="calendarTitle"></h2>

        <button id="nextMonth">→</button>

    </div>

    <div class="calendar-week">

        <div>日</div>
        <div>月</div>
        <div>火</div>
        <div>水</div>
        <div>木</div>
        <div>金</div>
        <div>土</div>

    </div>

    <div
        id="calendarDays"
        class="calendar-days">
    </div>

</div>


<!-- 月別・日別 -->
<div class="usage-grid">

    <div class="usage-card">

        <h2>📅 月別</h2>

        <div id="monthlyResult">

            <p>読み込み中...</p>

        </div>

    </div>


    <div class="usage-card">

        <h2>📅 日別</h2>

        <div id="dailyResult">

            <p>日付を選択してください。</p>

        </div>

    </div>

</div>


<!-- 期間指定 -->
<div class="period-section">

    <h2>📆 期間指定</h2>

    <div class="period-inputs">

        <input
            type="date"
            id="periodStart">

        <span>〜</span>

        <input
            type="date"
            id="periodEnd">

    </div>

    <div id="periodResult">

        <p>期間を選択してください。</p>

    </div>

</div>


<!-- 過去最高 -->
<div class="record-section">

    <h2>🏆 過去最高</h2>

    <div id="recordResult">

        <p>読み込み中...</p>

    </div>

</div>

<a href="admin-dashboard.html" class="back-btn">
    ← 管理メニューに戻る
</a>

<script>

const SUPABASE_URL =
    "https://atntpiskoizpysukygcb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_y1wlMl-CRMTt-6us0M-P4Q_8OPouULn";

const token =
    localStorage.getItem("admin_access_token");

document.getElementById(
    "periodEnd"
).addEventListener(
    "change",
    async function(){

        const startDate =
            document.getElementById(
                "periodStart"
            ).value;

        const endDate = this.value;

        if(!startDate || !endDate){
            return;
        }

        if(startDate > endDate){

            document.getElementById(
                "periodResult"
            ).innerHTML =
                "<p>開始日は終了日より前にしてください。</p>";

            return;
        }

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/rpc/get_period_usage`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        start_date:
                            startDate,

                        end_date:
                            endDate
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            document.getElementById(
                "periodResult"
            ).innerHTML =
                "<p>データ取得に失敗しました。</p>";

            console.error(data);

            return;
        }

        const result = data[0];

        const accuracy =
            result.questions > 0
            ? (
                result.correct /
                result.questions *
                100
              ).toFixed(1)
            : "0.0";

        document.getElementById(
            "periodResult"
        ).innerHTML = `

            <h2>
                ${startDate} ～ ${endDate}
            </h2>

            <p>
                利用者数：
                ${result.users}
            </p>

            <p>
                学習記録：
                ${result.records}
            </p>

            <p>
                問題数：
                ${result.questions}
            </p>

            <p>
                正解数：
                ${result.correct}
            </p>

            <p>
                正解率：
                ${accuracy}%
            </p>

        `;

    });

async function loadAllTimeRecords(){

    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/get_all_time_records`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${token}`
                }
            }
        );

    const data =
        await response.json();

    if(!response.ok){

        document.getElementById(
            "recordResult"
        ).innerHTML =
            "<p>過去最高データの取得に失敗しました。</p>";

        console.error(data);

        return;
    }

    const result = data[0];

    console.log("過去最高データ：", result);

    document.getElementById(
        "recordResult"
    ).innerHTML = `

        <p>
            最高利用者数：
            ${result.max_users}人
            （${result.max_users_date}）
        </p>

        <p>
            最高学習記録：
            ${result.max_records}回
            （${result.max_records_date}）
        </p>

        <p>
            最高問題数：
            ${result.max_questions}問
            （${result.max_questions_date}）
        </p>

        <p>
            最高正解数：
            ${result.max_correct}問
            （${result.max_correct_date}）
        </p>

        <p>
            最高1日正解率：
            ${Number(result.max_accuracy).toFixed(1)}%
            （${result.max_accuracy_date}）
        </p>

    `;
}

async function loadMonthlyUsage(year, month){

    const response =
        await fetch(
            `${SUPABASE_URL}/rest/v1/rpc/get_monthly_usage`,
            {
                method: "POST",

                headers: {
                    "Content-Type":
                        "application/json",

                    "apikey":
                        SUPABASE_KEY,

                    "Authorization":
                        `Bearer ${token}`
                },

                body: JSON.stringify({
                    target_year:
                        year,

                    target_month:
                        month
                })
            }
        );

    const data =
        await response.json();

    if(!response.ok){

        document.getElementById(
            "monthlyResult"
        ).innerHTML =
            "<p>月間データの取得に失敗しました。</p>";

        console.error(data);

        return;
    }

    const result = data[0];

    const accuracy =
        result.questions > 0
        ? (
            result.correct /
            result.questions *
            100
          ).toFixed(1)
        : "0.0";

    document.getElementById(
        "monthlyResult"
    ).innerHTML = `

        <h2>${year}年${month}月</h2>

        <p>
            利用者数：
            ${result.users}人
        </p>

        <p>
            学習記録：
            ${result.records}回
        </p>

        <p>
            問題数：
            ${result.questions}問
        </p>

        <p>
            正解数：
            ${result.correct}問
        </p>

        <p>
            正解率：
            ${accuracy}%
        </p>

    `;
}

loadAllTimeRecords();

const calendarTitle =
    document.getElementById("calendarTitle");

const calendarDays =
    document.getElementById("calendarDays");

let calendarDate = new Date();


function renderCalendar(){

    const year =
        calendarDate.getFullYear();

    const month =
        calendarDate.getMonth();

    calendarTitle.textContent =
        `${year}年${month + 1}月`;

    loadMonthlyUsage(
    year,
    month + 1
);

    calendarDays.innerHTML = "";

    const firstDay =
        new Date(
            year,
            month,
            1
        ).getDay();

    const lastDate =
        new Date(
            year,
            month + 1,
            0
        ).getDate();


    // 月初までの空白
    for(
        let i = 0;
        i < firstDay;
        i++
    ){

        const empty =
            document.createElement("div");

        calendarDays.appendChild(empty);

    }


    // 日付
    for(
        let day = 1;
        day <= lastDate;
        day++
    ){

        const button =
            document.createElement("button");

        button.textContent = day;

        button.addEventListener(
    "click",
    async function(){

                document
                    .querySelectorAll(
                        ".calendar-days button"
                    )
                    .forEach(
                        btn =>
                            btn.classList.remove(
                                "selected"
                            )
                    );

                button.classList.add(
                    "selected"
                );

                const selectedDate =
                    `${year}-${String(
                        month + 1
                    ).padStart(2,"0")}-${String(
                        day
                    ).padStart(2,"0")}`;

                console.log(
                    "選択日：",
                    selectedDate
                );

                const response =
    await fetch(
        `${SUPABASE_URL}/rest/v1/rpc/get_daily_usage`,
        {
            method: "POST",

            headers: {
                "Content-Type":
                    "application/json",

                "apikey":
                    SUPABASE_KEY,

                "Authorization":
                    `Bearer ${token}`
            },

            body: JSON.stringify({
                target_date:
                    selectedDate
            })
        }
    );

const data =
    await response.json();

console.log("学習推移データ：", data);

console.log("daily response:", response.status);
console.log("daily data:", data);

if(!response.ok){

    document.getElementById(
        "dailyResult"
    ).innerHTML =
        "<p>データ取得に失敗しました。</p>";

    console.error(data);

    return;
}

const result = data[0];

const accuracy =
    result.questions > 0
    ? (
        result.correct /
        result.questions *
        100
      ).toFixed(1)
    : "0.0";

document.getElementById(
    "dailyResult"
).innerHTML = `

    <h2>${selectedDate}</h2>

    <p>
        利用者数：
        ${result.users}人
    </p>

    <p>
        学習記録：
        ${result.records}回
    </p>

    <p>
        問題数：
        ${result.questions}問
    </p>

    <p>
        正解数：
        ${result.correct}問
    </p>

    <p>
        正解率：
        ${accuracy}%
    </p>

`;
                

            }
        );

        

        calendarDays.appendChild(
            button
        );

    }

}


document.getElementById(
    "prevMonth"
).addEventListener(
    "click",
    function(){

        calendarDate.setMonth(
            calendarDate.getMonth() - 1
        );

        renderCalendar();

    }
);


document.getElementById(
    "nextMonth"
).addEventListener(
    "click",
    function(){

        calendarDate.setMonth(
            calendarDate.getMonth() + 1
        );

        renderCalendar();

    }
);


renderCalendar();

</script>

</body>

</html>
