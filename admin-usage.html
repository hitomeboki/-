<!DOCTYPE html>
<html lang="ja">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>利用状況 | ひとめぼき道場</title>

</head>

<body>

<h1>📊 利用状況</h1>

<div>

    <label>
        日付：
        <input type="date" id="usageDate">
    </label>

</div>

<div id="usageResult">

    <p>日付を選択してください。</p>

</div>

<div style="margin-top:25px;">

    <label>
        月：
        <input type="month" id="usageMonth">
    </label>

</div>

<div id="monthlyResult">

    <p>月を選択してください。</p>

</div>

<a href="admin-dashboard.html">
    ← 管理メニューに戻る
</a>

<script>

const SUPABASE_URL =
    "https://atntpiskoizpysukygcb.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_y1wlMl-CRMTt-6us0M-P4Q_8OPouULn";

const token =
    localStorage.getItem("admin_access_token");


document.getElementById(
    "usageMonth"
).addEventListener(
    "change",
    async function(){

        const selectedMonth = this.value;

        if(!selectedMonth){
            return;
        }

        const [year, month] =
            selectedMonth.split("-");

        const response =
            await fetch(
                `${SUPABASE_URL}/rest/v1/rpc/get_monthly_usage`,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json",

                        "apikey":
                            SUPABASE_KEY,

                        "Authorization":
                            `Bearer ${token}`
                    },

                    body: JSON.stringify({
                        target_year:
                            Number(year),

                        target_month:
                            Number(month)
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok){

            document.getElementById(
                "monthlyResult"
            ).innerHTML =
                "<p>データ取得に失敗しました。</p>";

            console.error(data);

            return;
        }

        const result = data[0];

        const accuracy =
            result.questions > 0
            ? (
                result.correct /
                result.questions *
                100
              ).toFixed(1)
            : "0.0";


        document.getElementById(
            "monthlyResult"
        ).innerHTML = `

            <h2>${year}年${Number(month)}月</h2>

            <p>
                利用者数：
                ${result.users}
            </p>

            <p>
                学習記録：
                ${result.records}
            </p>

            <p>
                問題数：
                ${result.questions}
            </p>

            <p>
                正解数：
                ${result.correct}
            </p>

            <p>
                正解率：
                ${accuracy}%
            </p>

        `;

    });

</script>

</body>

</html>
