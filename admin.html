<!DOCTYPE html>
<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>ひとめぼき道場 管理画面</title>

<style>

body{
    font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Helvetica Neue",
    sans-serif;

    background:#f5f5f5;

    margin:0;
    padding:30px 20px;

    color:#222;
}

.container{
    max-width:900px;
    margin:0 auto;
}

h1{
    text-align:center;
    margin-bottom:30px;
}

.stats{
    display:grid;

    grid-template-columns:
    repeat(2,1fr);

    gap:16px;
}

.card{
    background:white;

    border-radius:16px;

    padding:22px;

    box-shadow:
    0 3px 12px
    rgba(0,0,0,0.08);
}

.card h2{
    font-size:16px;

    margin:0 0 10px;

    color:#666;
}

.number{
    font-size:32px;

    font-weight:bold;
}

@media(max-width:600px){

    body{
        padding:20px 14px;
    }

    .stats{
        grid-template-columns:1fr;
    }

}

</style>

</head>


<body>

<div id="loginArea">

    <h1>管理者ログイン</h1>

    <input
        type="email"
        id="email"
        placeholder="メールアドレス"
    >

    <input
        type="password"
        id="password"
        placeholder="パスワード"
    >

    <button id="loginBtn">
        ログイン
    </button>

    <p id="loginMessage"></p>

</div>

<script>

const SUPABASE_URL =
"https://atntpiskoizpysukygcb.supabase.co";

const SUPABASE_KEY =
"sb_publishable_y1wlMl-CRMTt-6us0M-P4Q_8OPouULn";


const emailInput =
document.getElementById("email");

const passwordInput =
document.getElementById("password");

const loginBtn =
document.getElementById("loginBtn");

const loginMessage =
document.getElementById("loginMessage");


loginBtn.addEventListener(
    "click",
    async function(){

        const email =
        emailInput.value.trim();

        const password =
        passwordInput.value;


        if(!email || !password){

            loginMessage.textContent =
            "メールアドレスとパスワードを入力してください。";

            return;

        }


        try{

            const response =
            await fetch(
                `${SUPABASE_URL}/auth/v1/token?grant_type=password`,
                {
                    method:"POST",

                    headers:{
                        "Content-Type":
                        "application/json",

                        "apikey":
                        SUPABASE_KEY
                    },

                    body:JSON.stringify({
                        email:email,
                        password:password
                    })
                }
            );


            const data =
            await response.json();


            if(!response.ok){

                loginMessage.textContent =
                "メールアドレスまたはパスワードが違います。";

                return;

            }


            localStorage.setItem(
                "admin_access_token",
                data.access_token
            );


            location.href =
            "admin-dashboard.html";


        }catch(error){

            loginMessage.textContent =
            "ログインに失敗しました。";

            console.error(error);

        }

    }
);

</script>

</body>

</html>
